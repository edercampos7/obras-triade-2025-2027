<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obras Triade 2025-2027 - Acompanhamento</title>
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div class="header">
      <img src="logo-triade.png" alt="Triade" class="logo" />
      <div class="header-text">
        <h1>Obras de Recape - Triade 2025/2027</h1>
        <div class="subtitle">Aricanduva, Vila Formosa, Carrão, Vila Prudente e Sapopemba</div>
      </div>
    </div>

    <div class="status-bar">
      <span class="dot loading" id="status-dot"></span>
      <span id="status-text">Carregando planilha...</span>
      <button id="refresh-btn">Atualizar agora</button>
    </div>

    <div id="summary-contratadas">
      <!-- preenchido via JS -->
    </div>

    <div id="summary-estudo">
      <!-- preenchido via JS -->
    </div>

    <div id="street-list"></div>
  </div>

  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
